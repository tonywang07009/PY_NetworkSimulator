name: Workflow package and CLI checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Package installation, upgrades and behavior tests
        run: python -B -m unittest discover -s tests
      - name: Package integrity and installed references
        run: python -B verify.py
      - name: Install pinned CLI check dependencies in the disposable runner
        shell: bash
        run: |
          npm install --prefix "${{ runner.temp }}/workflow-node" @fission-ai/openspec@1.14.3
          python -m pip install symdex==0.1.26
      - name: Fetch pinned Archify for the CLI check
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: tt-a1i/archify
          ref: b25142deac4b19b293e45b6bf6d69351d3c8f3b6
          path: .ci-archify
          persist-credentials: false
      - name: Exercise actual CLI interfaces in temporary projects
        run: python -B tests/smoke_tools.py --openspec-root "${{ runner.temp }}/workflow-node" --archify-root .ci-archify
